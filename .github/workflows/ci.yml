name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio fakeredis anyio
          
      - name: Run Pytest
        run: pytest --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v
        
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build Docker Image
        run: docker build -t my-chat-app:latest .
        
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Deploy to Cloud
        run: |
          echo "Deploying to Railway..."
          # Dùng token từ GitHub Secrets để deploy
          echo "Token: ${{ secrets.RAILWAY_TOKEN }}"
          # railway up --service day12-chat-service
